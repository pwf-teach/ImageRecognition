<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>揭開模型訓練的黑箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout：方格紙實驗筆記本。上方分組進度條、中間一頁一頁的講解、下方固定導覽列 */
:root{
  --paper:#f6f8fb;      /* 頁面底色：帶一點藍的方格紙 */
  --sheet:#ffffff;      /* 卡片／互動區 */
  --ink:#16202e;        /* 主要文字 */
  --muted:#5b6a7d;      /* 次要文字 */
  --line:#d5dde8;       /* 格線、框線 */
  --grid:#e7edf5;       /* 背景方格 */
  --accent:#d9480f;     /* 卷積核橘：重點、互動焦點 */
  --accent-soft:#ffe8dc;
  --teal:#0b7a75;       /* 像素綠藍：正確、資料 */
  --teal-soft:#d9f2ef;
  --bad:#c92a2a; --bad-soft:#ffe3e3;
  --code-bg:#f0f3f8;
  --g0:#5b6a7d; --g1:#0b7a75; --g2:#6741d9; --g3:#d9480f; --g4:#2b8a3e;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --fs-base:20px; --fs-small:17px; --fs-h1:40px; --fs-h2:28px; --fs-h3:22px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0f141b; --sheet:#171e28; --ink:#e8eef6; --muted:#9aa9bb; --line:#2c3746; --grid:#151c25;
  --accent:#ff8a4c; --accent-soft:#3a2216; --teal:#3cc7bf; --teal-soft:#0f302e;
  --bad:#ff6b6b; --bad-soft:#3a1717; --code-bg:#1d2633;
  --g0:#9aa9bb; --g1:#3cc7bf; --g2:#9775fa; --g3:#ff8a4c; --g4:#69db7c; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0f141b; --sheet:#171e28; --ink:#e8eef6; --muted:#9aa9bb; --line:#2c3746; --grid:#151c25;
  --accent:#ff8a4c; --accent-soft:#3a2216; --teal:#3cc7bf; --teal-soft:#0f302e;
  --bad:#ff6b6b; --bad-soft:#3a1717; --code-bg:#1d2633;
  --g0:#9aa9bb; --g1:#3cc7bf; --g2:#9775fa; --g3:#ff8a4c; --g4:#69db7c; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-base);line-height:1.65;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
[hidden]{display:none!important}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
p{margin:0}
code,.mono{font-family:var(--font-mono);font-size:.9em}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ── 上方：進度條 ── */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{font-weight:900;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.progress{display:flex;gap:14px;flex-wrap:wrap;flex:1;min-width:0}
.pgroup{display:flex;align-items:center;gap:6px}
.pgroup-label{font-size:13px;color:var(--muted);letter-spacing:.06em}
.dot{width:16px;height:16px;border-radius:4px;border:2px solid var(--gc);background:transparent;cursor:pointer;padding:0;position:relative}
.dot.done{background:color-mix(in srgb,var(--gc) 35%,transparent)}
.dot.current{background:var(--gc);transform:scale(1.2)}
.dot:hover::after{content:attr(data-title);position:absolute;top:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:14px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:20}

/* ── 頁面 ── */
main{max-width:1280px;margin:0 auto;padding-block:24px 120px;padding-inline:16px}
.page{display:none}
.page.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.active{animation:none}*{transition:none!important}}
.phead{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.tags{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numtag{font-family:var(--font-mono);font-weight:600;font-size:22px;background:var(--gc);color:var(--sheet);padding:2px 12px;border-radius:6px}
.numnote{font-size:14px;color:var(--muted)}
.chip{font-size:15px;font-weight:700;padding:2px 10px;border-radius:999px;border:2px solid currentColor}
.chip.todo{color:var(--accent)} .chip.bonus{color:var(--g2)}
.phead h2{font-size:var(--fs-h1);font-weight:900}
.phead .goal{color:var(--muted);font-size:var(--fs-base);max-width:60ch}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.row>*{min-width:0}
.grow{flex:1 1 320px}
.card h3{font-size:var(--fs-h3);font-weight:700;margin-bottom:10px}
.small{font-size:var(--fs-small);color:var(--muted)}
.btn{background:var(--sheet);border:2px solid var(--ink);border-radius:8px;padding:6px 16px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--accent-soft)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ok{color:var(--teal);font-weight:700} .err{color:var(--bad);font-weight:700}
.note{border-left:5px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:6px}
.note.teal{border-color:var(--teal);background:var(--teal-soft)}
.scroll-x{overflow-x:auto;max-width:100%}

/* 頁內分頁 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
.tab{background:none;border:none;border-bottom:4px solid transparent;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* 程式碼 */
pre.code{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0;font-family:var(--font-mono);font-size:17px;line-height:1.6;overflow-x:auto;white-space:pre}
.tk-k{color:var(--g2);font-weight:600} .tk-s{color:var(--teal)} .tk-c{color:var(--muted);font-style:italic} .tk-n{color:var(--accent)} .tk-f{color:var(--g4)}

/* 頁尾：答案、想一想 */
details.reveal{margin-top:26px;background:var(--sheet);border:2px dashed var(--line);border-radius:10px;padding:14px 18px}
details.reveal>summary{cursor:pointer;font-weight:700;font-size:var(--fs-h3);list-style:none}
details.reveal>summary::before{content:"▸ ";color:var(--accent)}
details.reveal[open]>summary::before{content:"▾ "}
details.reveal[open]{border-style:solid;border-color:var(--accent)}
details.reveal .inner{margin-top:12px;display:flex;flex-direction:column;gap:10px}

/* 數字格 */
.grid{display:grid;gap:2px;width:max-content}
.cell{width:var(--cs,40px);height:var(--cs,40px);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:var(--cf,15px);border-radius:3px;user-select:none;position:relative;font-variant-numeric:tabular-nums}
.cell.sel{outline:3px solid var(--accent);outline-offset:-3px;z-index:1}

/* ── 下方導覽列 ── */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navbar-inner{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.navbar .btn{font-size:20px;padding:8px 22px}
.counter{font-family:var(--font-mono);font-size:18px;color:var(--muted);text-align:center}
.counter b{color:var(--ink)}

/* 封面 */
.cover-title{font-size:clamp(34px,5vw,60px);font-weight:900;line-height:1.15;max-width:18ch}
.cover-sub{font-size:22px;color:var(--muted);margin-top:10px}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:34px}
.map-col{border-top:5px solid var(--gc);background:var(--sheet);border-radius:0 0 10px 10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.map-col h3{font-size:18px;color:var(--gc);letter-spacing:.08em}
.map-item{text-align:left;background:none;border:none;padding:6px 6px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:baseline;font-size:17px}
.map-item:hover{background:var(--accent-soft)}
.map-item .mono{color:var(--gc);font-weight:600;white-space:nowrap;font-size:14px}

.colab{margin-top:28px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--sheet)}
.colab-head{background:var(--ink);color:var(--sheet);padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:var(--fs-h3)}
.colab-head .where{font-family:var(--font-mono);background:var(--accent);color:#fff;padding:2px 10px;border-radius:6px;font-size:18px}
.colab-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.colab ol{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:6px}
.colab .blank{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:3px;padding:0 2px}
.tocolab{display:inline-flex;gap:8px;align-items:center;align-self:flex-start;border:2px solid var(--accent);color:var(--accent);background:var(--sheet);border-radius:999px;padding:4px 14px;font-weight:700;cursor:pointer}
.tocolab:hover{background:var(--accent-soft)}
/* placeholder */
.wip{display:flex;align-items:center;justify-content:center;min-height:260px;color:var(--muted);font-size:24px;border:2px dashed var(--line);border-radius:12px}

@media (max-width:640px){
  :root{--fs-base:17px;--fs-small:15px;--fs-h1:28px;--fs-h2:22px;--fs-h3:19px}
  .brand{display:none}
}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand">剪刀石頭布影像辨識</div>
  <nav class="progress" id="progress" aria-label="課程進度"></nav>
</div></header>

<main id="main"></main>

<footer class="navbar"><div class="navbar-inner">
  <button class="btn" id="prevBtn" type="button">◀ 上一步</button>
  <div class="counter" id="counter"></div>
  <button class="btn primary" id="nextBtn" type="button">下一步 ▶</button>
</div></footer>

<script>
/* ═════════ 共用工具 ═════════ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
};
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* 極簡語法高亮（Python / C++） */
function highlight(code, lang = "py") {
  const kw = lang === "cpp"
    ? /\b(for|int|float|unsigned|char|return|if|else|auto|void|double)\b/
    : /\b(for|in|range|def|return|if|else|elif|import|from|as|with|not|and|or|None|True|False|print|while)\b/;
  const re = /(#[^\n]*|\/\/[^\n]*)|("[^"\n]*"|'[^'\n]*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)(?=\()|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1]) out += `<span class="tk-c">${t}</span>`;
    else if (m[2]) out += `<span class="tk-s">${t}</span>`;
    else if (m[3]) out += `<span class="tk-n">${t}</span>`;
    else if (m[4]) out += kw.test(m[4]) ? `<span class="tk-k">${t}</span>` : `<span class="tk-f">${t}</span>`;
    else out += kw.test(m[5]) && m[5].match(kw)[0] === m[5] ? `<span class="tk-k">${t}</span>` : t;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
const codeBlock = (code, lang = "py") => h("pre", { class: "code", html: highlight(code, lang) });

/* 每頁的計時器：離開頁面時統一清掉 */
const Timers = {
  list: [],
  timeout(fn, ms) { const id = setTimeout(fn, ms); this.list.push(["t", id]); return id; },
  interval(fn, ms) { const id = setInterval(fn, ms); this.list.push(["i", id]); return id; },
  clear() { for (const [k, id] of this.list) k === "t" ? clearTimeout(id) : clearInterval(id); this.list = []; }
};

/* 頁內分頁 */
function makeTabs(defs) {
  const bar = h("div", { class: "tabs", role: "tablist" });
  const panes = [];
  defs.forEach((d, i) => {
    const b = h("button", { class: "tab", role: "tab", type: "button", "aria-selected": i === 0 ? "true" : "false" }, d.label);
    const pane = h("div", { role: "tabpanel" }, d.content);
    if (i) pane.hidden = true;
    b.addEventListener("click", () => {
      $$(".tab", bar).forEach(x => x.setAttribute("aria-selected", "false"));
      b.setAttribute("aria-selected", "true");
      panes.forEach(p => (p.hidden = true));
      pane.hidden = false;
      d.onShow && d.onShow();
    });
    bar.append(b); panes.push(pane);
  });
  return h("div", {}, bar, ...panes);
}
const answer = (...kids) => h("details", { class: "reveal" }, h("summary", {}, "顯示答案"), h("div", { class: "inner" }, ...kids));
const think = (q, ...kids) => h("details", { class: "reveal" }, h("summary", {}, "🤔 想一想：" + q), h("div", { class: "inner" }, ...kids));

/* 簡化手勢圖（SVG） */
function handSVG(kind, o = {}) {
  const { size = 90, bg = "#dbe4ee", dx = 0, dy = 0, rot = 0, scale = 1, flip = false, dark = 0, skin = "#e7b694", shade = "#c98f6d" } = o;
  const sx = flip ? -scale : scale;
  let g = `<rect x="41" y="74" width="18" height="30" rx="4" fill="${skin}"/>`;
  if (kind === "rock") {
    g += `<rect x="28" y="40" width="44" height="38" rx="13" fill="${skin}"/>
      ${[34, 44, 54, 64].map(x => `<circle cx="${x}" cy="42" r="6.5" fill="${skin}" stroke="${shade}" stroke-width="2"/>`).join("")}
      <rect x="27" y="56" width="30" height="10" rx="5" fill="${skin}" stroke="${shade}" stroke-width="2"/>`;
  } else if (kind === "paper") {
    g += `<rect x="31" y="46" width="38" height="34" rx="10" fill="${skin}"/>`;
    [[32, 20], [41, 14], [50, 13], [59, 18]].forEach(([x, y]) => (g += `<rect x="${x}" y="${y}" width="8" height="${50 - y}" rx="4" fill="${skin}"/>`));
    g += `<rect x="64" y="44" width="8" height="24" rx="4" fill="${skin}" transform="rotate(35 68 56)"/>`;
  } else {
    g += `<rect x="30" y="50" width="40" height="30" rx="12" fill="${skin}"/>
      <rect x="37" y="14" width="9" height="42" rx="4.5" fill="${skin}" transform="rotate(-14 41 52)"/>
      <rect x="51" y="14" width="9" height="42" rx="4.5" fill="${skin}" transform="rotate(14 55 52)"/>
      <path d="M34 66 H66" stroke="${shade}" stroke-width="2.5"/>`;
  }
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${{ rock: "石頭", paper: "布", scissors: "剪刀" }[kind]}">
    <rect width="100" height="100" fill="${bg}"/>
    <g transform="translate(${50 + dx} ${50 + dy}) rotate(${rot}) scale(${sx} ${scale}) translate(-50 -50)">${g}</g>
    ${dark ? `<rect width="100" height="100" fill="#000" opacity="${dark}"/>` : ""}</svg>`;
}
const rand = (a, b) => a + Math.random() * (b - a);

/* ═════════ 頁面清單 ═════════ */
const GROUPS = [
  { name: "準備", color: "var(--g0)" }, { name: "資料", color: "var(--g1)" }, { name: "模型", color: "var(--g2)" },
  { name: "訓練與結果", color: "var(--g3)" }, { name: "實驗與應用", color: "var(--g4)" }
];
const PAGES = [
  { num: "", title: "封面", g: 0 },
  { num: "第 0 節", title: "開始之前", g: 0, goal: "認識 Colab，完成上課前的準備。" },
  { num: "2-1～2-2", title: "拍照蒐集資料", g: 1, goal: "知道為什麼要拍兩組照片，以及各要怎麼拍。" },
  { num: "2-3～2-6", title: "照片存在哪裡？", g: 1, goal: "看懂資料夾結構與路徑，知道怎麼刪掉重拍。" },
  { num: "3-1", title: "影像就是數字", g: 1, todo: "TODO 1", goal: "一張彩色照片就是一個三維陣列；學會用切片取出一塊。", answer: "corner = arr[:4, :4, 0]" },
  { num: "3-2", title: "卷積是什麼？", g: 1, bonus: "★ 延伸挑戰 A 在本頁最後", goal: "看懂卷積核怎麼一格一格算出特徵圖。這是理解卷積神經網路的基礎，全班都要看。" },
  { num: "4-1", title: "資料擴增", g: 1, todo: "TODO 2" },
  { num: "4-1", title: "三組資料：訓練、驗證、挑戰", g: 1 },
  { num: "5-1", title: "凍結、微調、從零", g: 2, todo: "TODO 3" },
  { num: "5-2～5-3", title: "換掉最後一層", g: 2, todo: "TODO 4" },
  { num: "6-1～6-2", title: "訓練的五個步驟", g: 3, todo: "TODO 5" },
  { num: "6-3", title: "計算猜對幾張", g: 3, todo: "TODO 6" },
  { num: "6-5～6-6", title: "看懂訓練結果", g: 3 },
  { num: "6-7", title: "⏱ 計時賽", g: 3 },
  { num: "6-8", title: "記錄 loss 曲線", g: 3, bonus: "★ 延伸挑戰 C｜加分題，與 A 任選一題" },
  { num: "第 7 節", title: "我的實驗：只改一個變因", g: 4 },
  { num: "8-1", title: "把分數變成機率", g: 4, todo: "TODO 7" },
  { num: "第 9 節", title: "回到你的題目", g: 4 }
];
const BUILDERS = {};   // BUILDERS[i] = { build(section), enter(), leave() }

/* ═════════ 每頁「回到 Colab」要做什麼 ═════════ */
const COLAB = {
  1: { where: "第 0 節、第 1 節", steps: ["打開老師給的 Colab 學生版", "完成「第 0 節｜開始前請先做」的 4 個步驟（儲存副本、改檔名、選 T4 GPU）", "執行「第 1 節｜環境設定」那一格"] },

    /* 在 Colab 哪裡看 */
